name: Update 13F Data Quarterly

on:
  schedule:
    # 13F deadline = 45 days after quarter end (Feb 14 / May 15 / Aug 14 / Nov 14).
    # Most managers file ON deadline day (or the next business day when it falls on
    # a weekend/holiday), so pulling before/at the deadline captures almost nothing
    # (May 15 2026 run: 16 of ~57 institutions). Pull on the 20th, 06:00 UTC.
    - cron: '0 6 20 2,5,8,11 *'
  
  workflow_dispatch:  # Manual trigger; optionally re-run a specific quarter
    inputs:
      quarter:
        description: 'Target quarter (1-4); leave empty for latest completed'
        required: false
      year:
        description: 'Target year (e.g. 2026); required with quarter'
        required: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Clean stale cache files
      env:
        Q_OVERRIDE: ${{ inputs.quarter }}
        Y_OVERRIDE: ${{ inputs.year }}
      run: |
        # Remove cache files that could interfere with new quarter processing
        rm -f data/mappings/analysis_progress.json
        rm -f data/mappings/enriched_holdings_cache.json
        rm -f data/13f_filings/download_progress_v2.json
        rm -rf data/sec_data/*
        rm -f data/cik_metadata.json
        rm -rf data/mappings/*
        # Keep published quarters as history, but clear current + previous so
        # both regenerate from freshly downloaded filings under the same
        # roster — a stale prev-quarter JSON from an older roster would turn
        # every pruned institution into a phantom "dropped holder".
        python - <<'EOF'
        import os, shutil
        from datetime import date
        if os.environ.get('Q_OVERRIDE') and os.environ.get('Y_OVERRIDE'):
            q, y = int(os.environ['Q_OVERRIDE']), int(os.environ['Y_OVERRIDE'])
        else:
            t = date.today()
            q, y = ((t.month - 1) // 3, t.year) if t.month > 3 else (4, t.year - 1)
        pq, py = (q - 1, y) if q > 1 else (4, y - 1)
        for qq, yy in [(q, y), (pq, py)]:
            shutil.rmtree(f'output/Q{qq}_{yy}', ignore_errors=True)
            print(f'cleared output/Q{qq}_{yy}')
        EOF

    
    - name: Run pipeline
      env:
        # config_loader.py reads SEC_USER_* — env names must match it, or the
        # pipeline silently falls back to the placeholder user agent
        SEC_USER_EMAIL: ${{ secrets.SEC_EMAIL }}
        SEC_USER_NAME: ${{ secrets.SEC_NAME }}
        Q_OVERRIDE: ${{ inputs.quarter }}
        Y_OVERRIDE: ${{ inputs.year }}
      run: |
        cd pipeline
        ARGS="--top 200"
        if [ -n "$Q_OVERRIDE" ] && [ -n "$Y_OVERRIDE" ]; then
          ARGS="$ARGS --quarter $Q_OVERRIDE --year $Y_OVERRIDE"
        fi
        python 00_download_13f_filings.py $ARGS
        python 01_download_sec_tickers.py
        python 02_build_cusip_mappings.py
        python 03_get_sec_shares_outstanding.py
        python 04_complete_cusip_mapping.py
        python 05_analyze_net_adds.py

    - name: Verify filing coverage
      env:
        Q_OVERRIDE: ${{ inputs.quarter }}
        Y_OVERRIDE: ${{ inputs.year }}
      run: |
        # Conviction roster = 77 institutions; healthy quarter ≈ 70+ filed and
        # ~1900 securities. A low count means the filing wave hasn't landed yet —
        # fail here so stale-good data stays published.
        python - <<'EOF'
        import json, os, sys
        from statistics import median
        from datetime import date
        if os.environ.get('Q_OVERRIDE') and os.environ.get('Y_OVERRIDE'):
            q, y = int(os.environ['Q_OVERRIDE']), int(os.environ['Y_OVERRIDE'])
        else:
            t = date.today()
            q, y = ((t.month - 1) // 3, t.year) if t.month > 3 else (4, t.year - 1)
        path = f'output/Q{q}_{y}/quarterly_adds_data.json'
        try:
            m = json.load(open(path))['metadata']
            n = m['institution_breakdown']['current_quarter_institutions']
            s = m['total_securities']
        except (FileNotFoundError, KeyError) as e:
            sys.exit(f'coverage check failed reading {path}: {e!r}')
        print(f'Q{q} {y}: {n} current-quarter institutions, {s} securities')
        if n < 55:
            sys.exit(f'only {n} current-quarter institutions (<55) — refusing to publish thin data')
        if s < 1200:
            sys.exit(f'only {s} securities (<1200, healthy ~1900) — an upstream mapping/shares step likely failed')
        # Unit sanity: a filer still reporting values in thousands (pre-2023
        # convention) would land 1000x low — implied share prices expose it.
        holdings = json.load(open(f'output/Q{q}_{y}/total_holdings_data.json'))
        prices = {}
        for sec in holdings['securities']:
            for inst, pos in sec.get('positions', {}).items():
                if pos.get('shares'):
                    prices.setdefault(inst, []).append(pos['value'] / 1000 / pos['shares'])
        bad = {i: round(median(p), 4) for i, p in prices.items() if len(p) >= 5 and median(p) < 0.5}
        if bad:
            sys.exit(f'implied share prices suggest thousands-scaled filings (unit bug): {bad}')
        print(f'unit sanity OK across {len(prices)} institutions')
        EOF

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f output/
        git add -f data/cik_metadata.json
        git add -f data/mappings/
        git add -f data/sec_data/*.json
        git add -f config/target_firms.json
        git diff --staged --quiet || git commit -m "Update 13F data"
        git pull --rebase origin main
        git push
