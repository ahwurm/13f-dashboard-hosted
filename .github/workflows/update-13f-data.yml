name: Update 13F Data Quarterly

on:
  schedule:
    # 13F deadline = 45 days after quarter end (Feb 14 / May 15 / Aug 14 / Nov 14).
    # Most managers file ON deadline day (or the next business day when it falls on
    # a weekend/holiday), so pulling before/at the deadline captures almost nothing
    # (May 15 2026 run: 16 of ~57 institutions). Pull on the 20th, 06:00 UTC.
    - cron: '0 6 20 2,5,8,11 *'
  
  workflow_dispatch:  # Manual trigger for testing

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Clean stale cache files
      run: |
        # Remove cache files that could interfere with new quarter processing
        rm -f data/mappings/analysis_progress.json
        rm -f data/mappings/enriched_holdings_cache.json
        rm -f data/13f_filings/download_progress_v2.json
        rm -rf output/*
        rm -rf data/sec_data/*
        rm -f data/cik_metadata.json
        rm -rf data/mappings/*

    
    - name: Run pipeline
      env:
        SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
        SEC_NAME: ${{ secrets.SEC_NAME }}
      run: |
        cd pipeline
        python 00_download_13f_filings.py --top 200
        python 01_download_sec_tickers.py
        python 02_build_cusip_mappings.py
        python 03_get_sec_shares_outstanding.py
        python 04_complete_cusip_mapping.py
        python 05_analyze_net_adds.py

    - name: Verify filing coverage
      run: |
        # Healthy quarter ≈ 57 current-quarter institutions. A low count means the
        # filing wave hasn't landed yet — fail here so stale-good data stays published.
        python - <<'EOF'
        import json, sys
        from datetime import date
        t = date.today()
        q, y = ((t.month - 1) // 3, t.year) if t.month > 3 else (4, t.year - 1)
        path = f'output/Q{q}_{y}/quarterly_adds_data.json'
        try:
            n = json.load(open(path))['metadata']['institution_breakdown']['current_quarter_institutions']
        except (FileNotFoundError, KeyError) as e:
            sys.exit(f'coverage check failed reading {path}: {e!r}')
        print(f'Q{q} {y}: {n} current-quarter institutions')
        if n < 40:
            sys.exit(f'only {n} current-quarter institutions (<40) — refusing to publish thin data')
        EOF

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f output/
        git add -f data/cik_metadata.json
        git add -f data/mappings/
        git add -f data/sec_data/*.json
        git add -f config/target_firms.json
        git diff --staged --quiet || git commit -m "Update 13F data"
        git pull --rebase origin main
        git push
